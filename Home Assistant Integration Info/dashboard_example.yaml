views:
  - title: Printers
    type: panel
    cards:
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
              background: none !important;
              box-shadow: none !important;
              border: none !important;
              max-width: 1600px;
              margin: 0 auto;
              padding: 12px;
            }
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:stack-in-card
                card_mod:
                  style: |
                    ha-card {
                      padding: 12px;
                      background: var(--card-background-color);
                      border: none !important;
                      max-width: 100%;
                      margin: 0 auto;
                    }
                cards:
                  - type: custom:button-card
                    custom_fields:
                      header: |
                        [[[
                          var n = states['sensor.chi_bambu_printer_name'];
                          var name = (n && n.state && n.state !== 'unknown') ? n.state : 'Printer Status';
                          return `<div style="display: flex; justify-content: flex-start; align-items: center; padding-bottom: 10px; width: 100%;">
                                    <h1 style="margin: 0; text-align: left; color: var(--primary-text-color);">${name}</h1>
                                    <img src="https://portal.bblmw.com/p1/p1s-footer-8b1ba6b450474.png" style="height: 45px; width: 45px; object-fit: contain; margin-left: 15px;" />
                                  </div>`;
                        ]]]
                    styles:
                      grid:
                        - grid-template-areas: '"header"'
                        - grid-template-columns: 1fr
                      card:
                        - background: none
                        - box-shadow: none
                        - border: none
                        - cursor: default
                        - padding: 0
                      custom_fields:
                        header:
                          - justify-self: start
                          - width: 100%
                  - type: conditional
                    conditions:
                      - entity: sensor.chi_bambu_printer_name
                        state: Unavailable
                    card:
                      type: markdown
                      card_mod:
                        style: >-
                          ha-card { background: none !important; box-shadow:
                          none !important; border: none !important; }
                      content: >-
                        <div style="text-align: center; padding: 30px; color:
                        #ff5252;">
                          <ha-icon icon="mdi:printer-3d-nozzle-alert" style="--mdc-icon-size: 64px;"></ha-icon>
                          <h2>Printer Unavailable</h2>
                          <p>Awaiting data from ESP32. A sync command was sent at startup.</p>
                        </div>
                  - type: conditional
                    conditions:
                      - entity: sensor.chi_bambu_printer_name
                        state_not: Unavailable
                    card:
                      type: vertical-stack
                      cards:
                        - type: horizontal-stack
                          cards:
                            - type: custom:stack-in-card
                              card_mod:
                                style: |
                                  ha-card {
                                    box-shadow: 0px 2px 5px rgba(0,0,0,0.2) !important;
                                    border: 1px solid rgba(128,128,128,0.2) !important;
                                    border-radius: 12px !important;
                                    background: rgba(120,120,120,0.05) !important;
                                    margin: 4px !important;
                                    padding: 8px !important;
                                    min-height: 318px;
                                  }
                              cards:
                                - type: markdown
                                  content: '### AMS Info'
                                  card_mod:
                                    style: >-
                                      ha-card { background: none !important;
                                      box-shadow: none !important; border: none
                                      !important; padding-bottom: 0 !important;
                                      margin-bottom: 8px !important; }
                                - type: grid
                                  columns: 4
                                  square: false
                                  cards:
                                    - type: custom:button-card
                                      entity: sensor.chi_bambu_ams_tray_1_percent
                                      icon: mdi:spool
                                      show_name: true
                                      show_label: true
                                      show_state: true
                                      name: >
                                        [[[ var e =
                                        states['sensor.chi_bambu_ams_tray_1_material'];
                                        return (e && e.state && e.state !==
                                        'unknown') ? e.state : 'Empty'; ]]]
                                      label: >
                                        [[[ var e =
                                        states['sensor.chi_bambu_ams_tray_1_brand'];
                                        return (e && e.state && e.state !==
                                        'unknown') ? e.state : '-'; ]]]
                                      state_display: >
                                        [[[ var e =
                                        states['sensor.chi_bambu_ams_tray_1_percent'];
                                        var pct = e ? e.state : 'unknown';
                                        return (pct === '-1' || pct ===
                                        'unknown' || pct === '') ? '—' : pct +
                                        '%'; ]]]
                                      custom_fields:
                                        color_dot: |
                                          [[[
                                            var e = states['sensor.chi_bambu_ams_tray_1_color'];
                                            var raw = (e && e.state && e.state !== 'unknown') ? e.state.trim() : '555555FF';
                                            var hex = raw.substring(0, 6);
                                            var bg = (hex === '000000') ? '#222222' : '#' + hex;
                                            var border = (hex === 'FFFFFF' || hex === 'FFFFFE') ? '2px solid rgba(150,150,150,0.6)' : '2px solid rgba(255,255,255,0.25)';
                                            return `<div style="width:28px; height:45px; border-radius:6px; background:${bg}; border:${border}; box-shadow:0 1px 4px rgba(0,0,0,0.5); margin:2px auto;"></div>`;
                                          ]]]
                                      styles:
